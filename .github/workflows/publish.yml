name: Publish npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to publish (for example v0.1.2)"
        required: true
        type: string

permissions:
  contents: read
  # Required for npm Trusted Publishing (OIDC) and provenance.
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # npm Trusted Publishing requires Node.js 22.14.0 or newer.
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use npm 11
        # Trusted Publishing requires npm 11.5.1 or newer. npm 12 requires a
        # newer Node.js than the Node 22.14 baseline used here.
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Check whether this version is already on npm
        id: published
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if npm view "redis-switchboard-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "redis-switchboard-mcp@${VERSION} is already published; skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "redis-switchboard-mcp@${VERSION} is not published yet."
          fi

      # Trusted Publishing uses GitHub OIDC, so no NPM_TOKEN is needed.
      # Configure it once on npm:
      #   Package settings -> Trusted Publisher -> GitHub Actions
      #   owner: hexiaowu
      #   repository: redis-switchboard-mcp
      #   workflow filename: publish.yml
      #   environment: leave blank
      #
      # prepublishOnly runs typecheck, test typecheck, build and the full test
      # suite. If any of them fail, npm publish stops before uploading.
      - name: Publish to npm
        if: steps.published.outputs.exists == 'false'
        run: npm publish --access public
